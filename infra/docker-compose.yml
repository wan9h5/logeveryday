services:
  mysql:
    image: mysql:8.4
    container_name: modular-life-journal-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: modular_life_journal
      MYSQL_USER: journal
      MYSQL_PASSWORD: journal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - modular_life_journal_mysql:/var/lib/mysql

volumes:
  modular_life_journal_mysql:
